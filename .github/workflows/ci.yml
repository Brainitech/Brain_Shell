name: Brain Shell CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────
  #  Arch Linux — pacman + AUR dry-run
  # ─────────────────────────────────────────────
  arch-validate:
    name: Arch Linux — Dependency & Lint Check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pacman & install base tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git base-devel python

      - name: Validate pacman dependencies exist in repos
        run: |
          PACMAN_DEPS=(
            qt6-base qt6-declarative qt6-wayland qt6-multimedia qt6-5compat qt6ct
            pipewire pipewire-pulse wireplumber
            playerctl mpv-mpris mpd-mpris
            networkmanager bluez bluez-utils
            brightnessctl upower libnotify polkit kitty
            python wl-clipboard slurp xdg-user-dirs
            wf-recorder cava imagemagick wtype
            lm_sensors util-linux
            hyprland hyprsunset hyprlock hyprpolkitagent hypridle
            xdg-desktop-portal-hyprland xdg-desktop-portal-gtk
            ttf-jetbrains-mono-nerd ttf-nerd-fonts-symbols-common
            cliphist awww matugen
          )
          FAILED=()
          for pkg in "${PACMAN_DEPS[@]}"; do
            if pacman -Si "$pkg" &>/dev/null; then
              echo "✓ $pkg"
            else
              echo "✗ $pkg (not found in repos)"
              FAILED+=("$pkg")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Missing packages: ${FAILED[*]}"
            exit 1
          fi

      - name: Validate AUR packages exist on AUR RPC
        run: |
          AUR_DEPS=(
            quickshell-git
            envycontrol
            auto-cpufreq
            nbfc-linux
            grimblast-git
          )
          FAILED=()
          for pkg in "${AUR_DEPS[@]}"; do
            STATUS=$(curl -s "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('ok' if d.get('resultcount',0)>0 else 'missing')")
            if [[ "$STATUS" == "ok" ]]; then
              echo "✓ $pkg (AUR)"
            else
              echo "✗ $pkg not found on AUR"
              FAILED+=("$pkg")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Missing AUR packages: ${FAILED[*]}"
            exit 1
          fi

      - name: Lint install.sh
        run: |
          pacman -S --needed --noconfirm shellcheck
          shellcheck install.sh
          echo "✓ install.sh passed ShellCheck"

      - name: Lint dots-extra/install-arch.sh
        run: |
          bash -n dots-extra/install-arch.sh
          echo "✓ install-arch.sh syntax OK"

      - name: Lint nix/launcher.sh
        run: |
          bash -n nix/launcher.sh
          echo "✓ launcher.sh syntax OK"

      - name: Lint shell scripts in src/scripts/
        run: |
          bash -n src/scripts/GfxSwitch.sh
          bash -n src/scripts/PowerControl.sh
          bash -n src/scripts/screenshot.sh
          bash -n src/scripts/init_user_dir.sh
          bash -n src/scripts/migrate_v0.2.0.sh
          bash -n src/scripts/generate_wallpaper_thumbnails.sh
          echo "✓ src/scripts/ syntax OK"

      - name: Lint Python scripts
        run: |
          python3 -m py_compile src/scripts/hypr_binds.py
          echo "✓ hypr_binds.py syntax OK"

      - name: Validate QML syntax and existence
        run: |
          FAILED=()
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ]; then
              echo "✗ Empty file: $f"
              FAILED+=("$f")
            else
              # Run qmllint and capture output. 
              # We grep for actual syntax/token errors to avoid failing on missing Quickshell C++ modules in the CI container
              OUT=$(qmllint "$f" 2>&1 || true)
              if echo "$OUT" | grep -q -iE "expected token|syntax error"; then
                echo "✗ Syntax error in $f:"
                echo "$OUT"
                FAILED+=("$f")
              else
                echo "✓ $f"
              fi
            fi
          done < <(find src -name "*.qml" -print0)
          
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "QML Validation Failed!"
            exit 1
          fi

      - name: Validate qmldir files
        run: |
          for f in $(find src -name "qmldir"); do
            echo "✓ Found qmldir: $f"
            cat "$f"
          done

  # ─────────────────────────────────────────────
  #  NixOS — flake check
  # ─────────────────────────────────────────────
  nix-validate:
    name: NixOS — Flake & Package Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Validate Nix files syntax
        run: |
          # Check files exist and are valid UTF-8 text
          cat flake.nix > /dev/null
          # Use nix-instantiate for pure syntax check (no network, no path access)
          nix-instantiate --parse flake.nix > /dev/null
          nix-instantiate --parse nix/deps.nix > /dev/null
          nix-instantiate --parse nix/package.nix > /dev/null
          nix-instantiate --parse nix/modules/nixos.nix > /dev/null
          nix-instantiate --parse nix/modules/home-manager.nix > /dev/null
          echo "✓ All Nix files syntax OK"

      - name: Validate flake.lock structure
        run: |
          python3 -c "
          import json, sys
          with open('flake.lock') as f:
              lock = json.load(f)
          assert lock.get('version') == 7, 'Expected lock version 7'
          nodes = lock.get('nodes', {})
          print(f'Lock version: {lock[\"version\"]}')
          print(f'Nodes: {list(nodes.keys())}')
          for name, node in nodes.items():
              if 'locked' in node:
                  rev = node['locked'].get('rev', 'N/A')[:10]
                  print(f'  ✓ {name}: {rev}')
          "

      - name: Validate Flake and Nix modules declare required outputs
        run: |
          python3 -c "
          with open('flake.nix') as f:
              flake_content = f.read()

          with open('nix/modules/nixos.nix') as f:
              nixos_content = f.read()

          with open('nix/modules/home-manager.nix') as f:
              hm_content = f.read()

          with open('nix/deps.nix') as f:
              deps_content = f.read()

          checks = {
            'flake: packages':              'packages' in flake_content,
            'flake: apps':                  'apps' in flake_content,
            'flake: devShells':             'devShells' in flake_content,
            'flake: nixosModules':          'nixosModules' in flake_content,
            'flake: homeManagerModules':    'homeManagerModules' in flake_content,
            'flake: overlays':              'overlays' in flake_content,
            'flake: description':           'description' in flake_content,
            'flake: brain-shell':           'brain-shell' in flake_content,
            'nixos: programs.brain-shell':  'programs.brain-shell' in nixos_content,
            'nixos: programs.hyprland':     'programs.hyprland.enable' in nixos_content,
            'nixos: services.pipewire':     'services.pipewire' in nixos_content,
            'hm: programs.brain-shell':     'programs.brain-shell' in hm_content,
            'deps: kitty':                  'kitty' in deps_content,
            'deps: quickshell':             'quickshell' in deps_content,
            'deps: hyprland':               'hyprland' in deps_content,
          }
          failed = []
          for key, ok in checks.items():
              if ok:
                  print(f'  ✓ {key} declared')
              else:
                  print(f'  ✗ {key} MISSING')
                  failed.append(key)
          if failed:
              raise SystemExit(f'Missing declarations: {failed}')
          "

  # ─────────────────────────────────────────────
  #  Structure Sanity Check (both runners agree)
  # ─────────────────────────────────────────────
  structure-check:
    name: Repo Structure Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          REQUIRED=(
            "shell.qml"
            "flake.nix"
            "flake.lock"
            "install.sh"
            "dots-extra/install-arch.sh"
            "nix/package.nix"
            "nix/deps.nix"
            "nix/launcher.sh"
            "nix/modules/nixos.nix"
            "nix/modules/home-manager.nix"
            "src/config/brain-shell-colors.json.example"
            "src/theme/Theme.qml"
            "src/theme/ColorLoader.qml"
            "src/state/ShellState.qml"
            "src/state/Popups.qml"
            "src/state/SurfaceState.qml"
            "src/windows/DynamicSurface.qml"
            "src/windows/SurfaceInputManager.qml"
            "src/components/SurfaceShape.qml"
            "src/popups/Dashboard.qml"
            "src/scripts/hypr_binds.py"
            "src/scripts/screenshot.sh"
            "src/scripts/PowerControl.sh"
            "src/scripts/init_user_dir.sh"
            "src/scripts/migrate_v0.2.0.sh"
          )
          FAILED=()
          for f in "${REQUIRED[@]}"; do
            if [[ -f "$f" ]]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              FAILED+=("$f")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Missing required files: ${FAILED[*]}"
            exit 1
          fi

      - name: Count QML files per module
        run: |
          echo "QML file counts by directory:"
          find src -name "*.qml" | sed 's|/[^/]*$||' | sort | uniq -c | sort -rn

      - name: Check script shebangs
        run: |
          head -1 install.sh | grep -q "^#!/" && echo "✓ shebang OK (install.sh)" || (echo "✗ Missing shebang in install.sh" && exit 1)
          head -1 dots-extra/install-arch.sh | grep -q "^#!/" && echo "✓ shebang OK (install-arch.sh)" || (echo "✗ Missing shebang in install-arch.sh" && exit 1)
          head -1 nix/launcher.sh | grep -q "^#!/" && echo "✓ shebang OK (nix/launcher.sh)" || (echo "✗ Missing shebang in nix/launcher.sh" && exit 1)
          head -1 src/scripts/init_user_dir.sh | grep -q "^#!/" && echo "✓ shebang OK (init_user_dir.sh)" || (echo "✗ Missing shebang in init_user_dir.sh" && exit 1)
          head -1 src/scripts/migrate_v0.2.0.sh | grep -q "^#!/" && echo "✓ shebang OK (migrate_v0.2.0.sh)" || (echo "✗ Missing shebang in migrate_v0.2.0.sh" && exit 1)
          head -1 src/scripts/PowerControl.sh | grep -q "^#!/" && echo "✓ shebang OK (PowerControl.sh)" || (echo "✗ Missing shebang in PowerControl.sh" && exit 1)
          head -1 src/scripts/screenshot.sh | grep -q "^#!/" && echo "✓ shebang OK (screenshot.sh)" || (echo "✗ Missing shebang in screenshot.sh" && exit 1)
          head -1 src/scripts/GfxSwitch.sh | grep -q "^#!/" && echo "✓ shebang OK (GfxSwitch.sh)" || (echo "✗ Missing shebang in GfxSwitch.sh" && exit 1)
