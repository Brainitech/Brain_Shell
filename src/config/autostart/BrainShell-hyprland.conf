# Brain Shell — Hyprland integration (Hyprlang format)
# Source this file from your hyprland.conf:
#   source = ~/.config/quickshell/src/config/autostart/BrainShell-hyprland.conf
#
# On NixOS with the Home Manager module and systemd.enable = true, Brain Shell
# and its daemons are managed by systemd user services — do not source the
# exec-once lines in that case. Source only the layer rules and keybinds.

# Daemon autostarts (omit these blocks on NixOS when using the HM module)
exec-once = awww-daemon
exec-once = hypridle
exec-once = command -v brain-shell >/dev/null 2>&1 && brain-shell || qs -p $HOME/.local/src/Brain_Shell
exec-once = bash -c 'if systemctl --user list-unit-files hyprpolkitagent.service >/dev/null 2>&1; then systemctl --user start hyprpolkitagent; elif command -v hyprpolkitagent >/dev/null 2>&1; then hyprpolkitagent; fi'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Layer rules — always required regardless of install method
layerrule = noanim, ^(brain-shell.*)$
layerrule = noanim, selection
layerrule = ignorealpha 1, selection

# Dynamic keybinds managed by Brain Shell's visual keybind editor
source = $HOME/.config/Brain_Shell/Brain_ShellKeybinds.conf
